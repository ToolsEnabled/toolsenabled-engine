{
  "version": 1,
  "filesystem_policy": {
    "include_workdir": true,
    "read_only": [
      "/bin",
      "/usr",
      "/lib",
      "/proc",
      "/dev/urandom",
      "/etc",
      "/var/log"
    ],
    "read_write": [
      "/tmp",
      "/dev/null"
    ]
  },
  "landlock": {
    "compatibility": "best_effort"
  },
  "network_policies": {
    "codex": {
      "name": "codex",
      "endpoints": [
        {
          "host": "api.openai.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        },
        {
          "host": "auth.openai.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        },
        {
          "host": "chatgpt.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        },
        {
          "host": "ab.chatgpt.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        }
      ],
      "binaries": [
        {
          "path": "/sandbox/.local/toolsenabled/runtime/node/lib/node_modules/@openai/**"
        }
      ]
    },
    "claude": {
      "name": "claude",
      "endpoints": [
        {
          "host": "api.anthropic.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        },
        {
          "host": "platform.claude.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        },
        {
          "host": "claude.ai",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        },
        {
          "host": "console.anthropic.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        },
        {
          "host": "mcp-proxy.anthropic.com",
          "port": 443,
          "protocol": "rest",
          "access": "read-write",
          "enforcement": "enforce"
        }
      ],
      "binaries": [
        {
          "path": "/sandbox/.local/toolsenabled/runtime/node/lib/node_modules/@anthropic-ai/**"
        }
      ]
    },
    "npm-install": {
      "name": "npm-install",
      "endpoints": [
        {
          "host": "registry.npmjs.org",
          "port": 443,
          "protocol": "rest",
          "access": "read-only",
          "enforcement": "enforce",
          "allow_encoded_slash": true
        }
      ],
      "binaries": [
        {
          "path": "/sandbox/.local/toolsenabled*/runtime/node/bin/node"
        }
      ]
    }
  }
}
